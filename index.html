<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spotify Stem Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise"></div>
  <div id="app">
    <header>
      <div class="logo">
        <span class="logo-main">Spotify</span><span class="logo-accent"> Stem Player</span>
      </div>
      <div class="header-badge">In-browser AI</div>
    </header>

    <section id="search-section">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search track or artist..." />
        <button id="btn-search">GO</button>
      </div>
      <div id="search-results"></div>
    </section>

    <section id="loading-section" class="hidden">
      <div class="loading-status">
        <h2 id="loading-title">Extracting Stems...</h2>
        <div class="progress-container">
          <div id="progress-bar"></div>
        </div>
        <p id="loading-detail">Analyzing audio frequencies...</p>
      </div>
    </section>

    <section id="mixer-section" class="hidden">
      <div class="mixer-grid">
        <div class="stem-ctrl" data-stem="vocals">
          <div class="stem-label">VOCALS</div>
          <div class="vu-col"><div class="vu-bar" id="vu-vocals"></div></div>
          <input type="range" class="fader" id="fader-vocals" min="0" max="1" step="0.01" value="1" />
        </div>
        <div class="stem-ctrl" data-stem="drums">
          <div class="stem-label">DRUMS</div>
          <div class="vu-col"><div class="vu-bar" id="vu-drums"></div></div>
          <input type="range" class="fader" id="fader-drums" min="0" max="1" step="0.01" value="1" />
        </div>
        <div class="stem-ctrl" data-stem="bass">
          <div class="stem-label">BASS</div>
          <div class="vu-col"><div class="vu-bar" id="vu-bass"></div></div>
          <input type="range" class="fader" id="fader-bass" min="0" max="1" step="0.01" value="1" />
        </div>
        <div class="stem-ctrl" data-stem="other">
          <div class="stem-label">OTHER</div>
          <div class="vu-col"><div class="vu-bar" id="vu-other"></div></div>
          <input type="range" class="fader" id="fader-other" min="0" max="1" step="0.01" value="1" />
        </div>
      </div>

      <div class="transport">
        <button class="btn-play" id="btn-play">
          <svg class="icon-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg class="icon-pause hidden" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
