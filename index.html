<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spotify Stem Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="noise"></div>

  <div id="app">

    <header>
      <div class="logo">
        <span class="logo-main">Spotify</span>
        <span class="logo-accent"> Stem Player</span>
      </div>
      <div class="header-badge">In-browser AI</div>
    </header>

    <!-- UPLOAD -->
    <section id="upload-section">
      <div id="drop-zone">
        <input type="file" id="file-input" accept=".mp3,.wav,.ogg,.flac,audio/*" />
        <div class="drop-content">
          <div class="upload-icon">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <circle cx="12" cy="12" r="3"/>
              <line x1="12" y1="2" x2="12" y2="9"/>
              <line x1="12" y1="15" x2="12" y2="22"/>
              <line x1="2" y1="12" x2="9" y2="12"/>
              <line x1="15" y1="12" x2="22" y2="12"/>
            </svg>
          </div>
          <p class="upload-title">Drop a track</p>
          <p class="upload-hint">MP3 · WAV · OGG · FLAC<br>Processed entirely in your browser</p>
        </div>
      </div>
    </section>

    <!-- PROCESSING -->
    <section id="processing-section" class="hidden">
      <div class="processing-card">
        <div class="processing-title" id="processing-label">Decoding audio…</div>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="processing-sub" id="processing-sub">Hang tight</div>
        <div class="stem-pills">
          <div class="pill" id="pill-vocals">Vocals</div>
          <div class="pill" id="pill-drums">Drums</div>
          <div class="pill" id="pill-bass">Bass</div>
          <div class="pill" id="pill-other">Other</div>
        </div>
      </div>
    </section>

    <!-- MIXER -->
    <section id="mixer-section" class="hidden">

      <div class="track-header">
        <div class="track-info">
          <div class="track-title" id="track-title">—</div>
        </div>
        <button class="btn-new" id="btn-new">↩ New</button>
      </div>

      <div class="timeline-wrap">
        <span class="time-label" id="time-cur">0:00</span>
        <div class="timeline-bar" id="timeline-bar">
          <div class="timeline-fill" id="timeline-fill"></div>
        </div>
        <span class="time-label" id="time-total">0:00</span>
      </div>

      <div class="channels" id="channels">

        <div class="channel" data-stem="vocals">
          <div class="ch-top">
            <span class="ch-name">Vocals</span>
            <div class="ch-btns">
              <button class="btn-solo" data-stem="vocals">S</button>
              <button class="btn-mute" data-stem="vocals">M</button>
            </div>
          </div>
          <canvas class="mini-wave" id="wave-vocals" height="36"></canvas>
          <div class="ch-bottom">
            <div class="vu-col"><div class="vu-bar" id="vu-vocals"></div></div>
            <input type="range" class="fader" id="fader-vocals" min="0" max="1" step="0.01" value="1" />
            <span class="vol-pct" id="pct-vocals">100%</span>
          </div>
        </div>

        <div class="channel" data-stem="drums">
          <div class="ch-top">
            <span class="ch-name">Drums</span>
            <div class="ch-btns">
              <button class="btn-solo" data-stem="drums">S</button>
              <button class="btn-mute" data-stem="drums">M</button>
            </div>
          </div>
          <canvas class="mini-wave" id="wave-drums" height="36"></canvas>
          <div class="ch-bottom">
            <div class="vu-col"><div class="vu-bar" id="vu-drums"></div></div>
            <input type="range" class="fader" id="fader-drums" min="0" max="1" step="0.01" value="1" />
            <span class="vol-pct" id="pct-drums">100%</span>
          </div>
        </div>

        <div class="channel" data-stem="bass">
          <div class="ch-top">
            <span class="ch-name">Bass</span>
            <div class="ch-btns">
              <button class="btn-solo" data-stem="bass">S</button>
              <button class="btn-mute" data-stem="bass">M</button>
            </div>
          </div>
          <canvas class="mini-wave" id="wave-bass" height="36"></canvas>
          <div class="ch-bottom">
            <div class="vu-col"><div class="vu-bar" id="vu-bass"></div></div>
            <input type="range" class="fader" id="fader-bass" min="0" max="1" step="0.01" value="1" />
            <span class="vol-pct" id="pct-bass">100%</span>
          </div>
        </div>

        <div class="channel" data-stem="other">
          <div class="ch-top">
            <span class="ch-name">Other</span>
            <div class="ch-btns">
              <button class="btn-solo" data-stem="other">S</button>
              <button class="btn-mute" data-stem="other">M</button>
            </div>
          </div>
          <canvas class="mini-wave" id="wave-other" height="36"></canvas>
          <div class="ch-bottom">
            <div class="vu-col"><div class="vu-bar" id="vu-other"></div></div>
            <input type="range" class="fader" id="fader-other" min="0" max="1" step="0.01" value="1" />
            <span class="vol-pct" id="pct-other">100%</span>
          </div>
        </div>

      </div>

      <div class="transport">
        <button class="btn-transport" id="btn-restart">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-5.01"/></svg>
        </button>
        <button class="btn-play" id="btn-play">
          <svg class="icon-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg class="icon-pause hidden" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <div class="master-vol-wrap">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <input type="range" id="master-vol" min="0" max="1" step="0.01" value="1" />
        </div>
      </div>

    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
