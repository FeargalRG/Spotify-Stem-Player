<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Stem Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <header>
    <div class="logo"><span class="logo-bold">Stem</span><span class="logo-thin">Player</span></div>
    <div class="logo-tag">In-browser AI</div>
  </header>

  <!-- ── UPLOAD ── -->
  <section id="upload-section">
    <div id="drop-zone">
      <!-- real file input, covers the whole zone -->
      <input type="file" id="file-input" accept=".mp3,.wav,.ogg,.flac,audio/*" />
      <div class="drop-inner" id="drop-inner">
        <div class="drop-icon">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4"/>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/>
            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/>
            <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
          </svg>
        </div>
        <p class="drop-title">Drop a track here</p>
        <p class="drop-hint">or tap to browse</p>
        <p class="drop-formats">MP3 · WAV · OGG · FLAC</p>
      </div>
    </div>
    <p class="upload-note">Everything runs in your browser — nothing is uploaded anywhere.</p>
  </section>

  <!-- ── PROCESSING ── -->
  <section id="processing-section" class="hidden">
    <div class="proc-card">
      <div class="proc-track-info">
        <div class="proc-filename" id="proc-filename">Loading…</div>
      </div>
      <div class="proc-stage" id="proc-stage">Reading file…</div>
      <div class="prog-track">
        <div class="prog-fill" id="prog-fill"></div>
      </div>
      <div class="proc-pct" id="proc-pct">0%</div>
      <div class="stem-pills">
        <span class="pill" id="pill-vocals">Vocals</span>
        <span class="pill" id="pill-drums">Drums</span>
        <span class="pill" id="pill-bass">Bass</span>
        <span class="pill" id="pill-other">Other</span>
      </div>
    </div>
  </section>

  <!-- ── MIXER ── -->
  <section id="mixer-section" class="hidden">

    <div class="mixer-header">
      <div class="mixer-title" id="mixer-title">—</div>
      <button class="btn-eject" id="btn-eject" title="Load new track">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 11 12 6 7 11"/><line x1="12" y1="6" x2="12" y2="18"/>
        </svg>
        New track
      </button>
    </div>

    <!-- timeline -->
    <div class="timeline-row">
      <span class="t-time" id="t-cur">0:00</span>
      <div class="timeline" id="timeline">
        <div class="tl-played" id="tl-played"></div>
      </div>
      <span class="t-time" id="t-total">0:00</span>
    </div>

    <!-- 4 channels -->
    <div class="channels">

      <div class="channel" id="ch-vocals" data-stem="vocals">
        <div class="ch-head">
          <span class="ch-name">Vocals</span>
          <div class="ch-btns">
            <button class="btn-s" data-stem="vocals" title="Solo">S</button>
            <button class="btn-m" data-stem="vocals" title="Mute">M</button>
          </div>
        </div>
        <canvas class="waveform" id="wv-vocals" height="40"></canvas>
        <div class="ch-foot">
          <div class="vu-track"><div class="vu-fill" id="vu-vocals"></div></div>
          <input class="fader" type="range" id="fader-vocals" min="0" max="1" step="0.01" value="1" />
          <span class="fader-val" id="fv-vocals">100</span>
        </div>
      </div>

      <div class="channel" id="ch-drums" data-stem="drums">
        <div class="ch-head">
          <span class="ch-name">Drums</span>
          <div class="ch-btns">
            <button class="btn-s" data-stem="drums" title="Solo">S</button>
            <button class="btn-m" data-stem="drums" title="Mute">M</button>
          </div>
        </div>
        <canvas class="waveform" id="wv-drums" height="40"></canvas>
        <div class="ch-foot">
          <div class="vu-track"><div class="vu-fill" id="vu-drums"></div></div>
          <input class="fader" type="range" id="fader-drums" min="0" max="1" step="0.01" value="1" />
          <span class="fader-val" id="fv-drums">100</span>
        </div>
      </div>

      <div class="channel" id="ch-bass" data-stem="bass">
        <div class="ch-head">
          <span class="ch-name">Bass</span>
          <div class="ch-btns">
            <button class="btn-s" data-stem="bass" title="Solo">S</button>
            <button class="btn-m" data-stem="bass" title="Mute">M</button>
          </div>
        </div>
        <canvas class="waveform" id="wv-bass" height="40"></canvas>
        <div class="ch-foot">
          <div class="vu-track"><div class="vu-fill" id="vu-bass"></div></div>
          <input class="fader" type="range" id="fader-bass" min="0" max="1" step="0.01" value="1" />
          <span class="fader-val" id="fv-bass">100</span>
        </div>
      </div>

      <div class="channel" id="ch-other" data-stem="other">
        <div class="ch-head">
          <span class="ch-name">Other</span>
          <div class="ch-btns">
            <button class="btn-s" data-stem="other" title="Solo">S</button>
            <button class="btn-m" data-stem="other" title="Mute">M</button>
          </div>
        </div>
        <canvas class="waveform" id="wv-other" height="40"></canvas>
        <div class="ch-foot">
          <div class="vu-track"><div class="vu-fill" id="vu-other"></div></div>
          <input class="fader" type="range" id="fader-other" min="0" max="1" step="0.01" value="1" />
          <span class="fader-val" id="fv-other">100</span>
        </div>
      </div>

    </div>

    <!-- transport -->
    <div class="transport">
      <button class="t-btn" id="btn-restart" title="Restart">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 .49-5"/>
        </svg>
      </button>

      <button class="t-play" id="btn-play">
        <svg class="ic-play" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6 3 20 12 6 21 6 3"/>
        </svg>
        <svg class="ic-pause hidden" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16" rx="1"/>
          <rect x="14" y="4" width="4" height="16" rx="1"/>
        </svg>
      </button>

      <div class="master-row">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <input type="range" id="master-vol" min="0" max="1" step="0.01" value="0.9" />
      </div>
    </div>

  </section>

</div>

<script src="app.js"></script>
</body>
</html>
